[project]
name = "video-audio-processing"
version = "0.1.0"
description = "Dynamic Video Summarizer using PyTorch"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "librosa",
    "resampy",
    "numpy",
    "h5py",
    "moviepy",
    "torch",
    "torchvision",
    "torchaudio",
    "tqdm",
]

[project.scripts]
vasp-train = "scripts.train:main"
vasp-evaluate = "scripts.evaluate:main"
vasp-extract = "scripts.extract_features:main"

[dependency-groups]
dev = []